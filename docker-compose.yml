services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
      - path: .env.local
        required: false
    container_name: symfony_php
    working_dir: /app
    volumes:
      - ./backend:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      # DATABASE_URL is loaded from env_file (.env → .env.local)

      # JWT Configuration (shared with notification service)
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set — run 'make gen-secret' and put it in .env}"
      JWT_ISSUER: "${JWT_ISSUER:-ara-platform}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ara-services}"

      # Notification service URL for sending notifications
      NOTIFICATION_SERVICE_URL: "http://notification:8081"
      # Chat service URL for messaging
      CHAT_SERVICE_URL: "http://chat:8082"

      # Xdebug
      XDEBUG_MODE: debug,develop
      XDEBUG_START_WITH_REQUEST: yes
      XDEBUG_CLIENT_HOST: host.docker.internal
      XDEBUG_CLIENT_PORT: 9003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /api/health is served by Symfony (checks DB + Redis); the bare /health
      # path is routed to the notification service by the Caddyfile.
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Scheduler worker - processes scheduled tasks
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
      - path: .env.local
        required: false
    container_name: symfony_scheduler
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-0}

      # JWT Configuration
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set — run 'make gen-secret' and put it in .env}"
      JWT_ISSUER: "${JWT_ISSUER:-ara-platform}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ara-services}"

      # Service URLs
      NOTIFICATION_SERVICE_URL: "http://notification:8081"
      CHAT_SERVICE_URL: "http://chat:8082"

      # Disable Xdebug for worker
      XDEBUG_MODE: "off"
    # Run the scheduler worker with auto-restart
    command: ["php", "bin/console", "messenger:consume", "scheduler_main", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "bin/console", "debug:scheduler", "--date=now"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Async worker - processes background jobs (notifications, emails)
  async-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
      - path: .env.local
        required: false
    container_name: symfony_async_worker
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-0}

      # JWT Configuration
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set — run 'make gen-secret' and put it in .env}"
      JWT_ISSUER: "${JWT_ISSUER:-ara-platform}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ara-services}"

      # Service URLs
      NOTIFICATION_SERVICE_URL: "http://notification:8081"
      CHAT_SERVICE_URL: "http://chat:8082"

      # Disable Xdebug for worker
      XDEBUG_MODE: "off"
    depends_on:
      redis:
        condition: service_healthy
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    restart: unless-stopped
    # Override the FrankenPHP base image healthcheck (which curls the web
    # server) — this container only runs the messenger consumer, no web server.
    healthcheck:
      test: ["CMD", "php", "bin/console", "messenger:stats"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: symfony_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-symfony}
      POSTGRES_USER: ${POSTGRES_USER:-symfony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symfony}
      # Additional database for Chat service (created by init script)
      CHAT_POSTGRES_DB: ${CHAT_POSTGRES_DB:-ara_chat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symfony} -d ${POSTGRES_DB:-symfony}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.4
    container_name: symfony_redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  administration:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ara_administration
    working_dir: /app
    volumes:
      - ./administration:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NOTIFICATION_SERVICE_URL: "http://notification:8081"
      CHAT_SERVICE_URL: "http://chat:8082"
    depends_on:
      php:
        condition: service_healthy
      notification:
        condition: service_healthy
      chat:
        condition: service_healthy

  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: ara_notification
    ports:
      # Loopback-only: external traffic reaches this service through
      # Caddy (/ws, /sse, /api/v1/notifications/*), never directly.
      - "127.0.0.1:8081:8081"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"

      # JWT Configuration (shared with Symfony)
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set — run 'make gen-secret' and put it in .env}"
      JWT_ISSUER: "${JWT_ISSUER:-ara-platform}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ara-services}"
      JWT_ALGORITHM: "RS256"
      JWT_PUBLICKEY: "/app/config/jwt/public.pem"

      # Redis
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      REDIS_CHANNELS: "notification:user:*,notification:broadcast,notification:channel:*"

      # WebSocket
      WEBSOCKET_HEARTBEAT_INTERVAL: "30"
      WEBSOCKET_CONNECTION_TIMEOUT: "120"
      WEBSOCKET_CLEANUP_INTERVAL: "60"

      # Optional features (from .env)
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      ACK_ENABLED: ${ACK_ENABLED:-false}
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-false}
      TENANT_ENABLED: ${TENANT_ENABLED:-false}
      CLUSTER_ENABLED: ${CLUSTER_ENABLED:-false}
    volumes:
      - ./backend/config/jwt/public.pem:/app/config/jwt/public.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  chat:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    container_name: ara_chat
    ports:
      # Loopback-only: external traffic reaches this service through
      # Caddy (/chat/*), never directly.
      - "127.0.0.1:8082:8082"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      CHAT__HOST: "0.0.0.0"
      CHAT__PORT: "8082"

      # JWT Configuration — RS256, verify with the backend's public key only.
      # Chat holds no signing-capable symmetric secret (prevents token forgery).
      CHAT__JWT__ALGORITHM: "RS256"
      CHAT__JWT__PUBLICKEY: "/app/config/jwt/public.pem"
      CHAT__JWT__ISSUER: "${JWT_ISSUER:-ara-platform}"
      CHAT__JWT__AUDIENCE: "${JWT_AUDIENCE:-ara-services}"

      # Redis
      CHAT__REDIS__URL: "${REDIS_URL:-redis://redis:6379}"

      # Database (uses separate database for isolation)
      CHAT__DATABASE__URL: "postgres://${POSTGRES_USER:-symfony}:${POSTGRES_PASSWORD:-symfony}@postgres:5432/${CHAT_POSTGRES_DB:-ara_chat}"
      CHAT__DATABASE__RUN_MIGRATIONS: "true"

      # WebSocket
      CHAT__WEBSOCKET__MAX_CONNECTIONS: "100000"
      CHAT__WEBSOCKET__MAX_CONNECTIONS_PER_USER: "5"
      CHAT__WEBSOCKET__HEARTBEAT_INTERVAL_SECONDS: "30"
      CHAT__WEBSOCKET__CONNECTION_TIMEOUT_SECONDS: "60"

      # Cluster mode
      CHAT__CLUSTER__ENABLED: ${CLUSTER_ENABLED:-false}
    volumes:
      # RS256 public key for JWT verification (read-only, generated by backend)
      - ./backend/config/jwt/public.pem:/app/config/jwt/public.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: ara_backup
    cap_add:
      - SETGID
      - SETUID
    environment:
      # Backup configuration
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 2 * * *}"
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      TZ: ${TZ:-UTC}

      # PostgreSQL connection (primary database)
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-symfony}
      PGPASSWORD: ${POSTGRES_PASSWORD:-symfony}
      PGDATABASE: ${POSTGRES_DB:-symfony}

      # Additional databases to backup (comma-separated)
      BACKUP_ADDITIONAL_DBS: ${CHAT_POSTGRES_DB:-ara_chat}

      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # S3 configuration (optional). Credentials are NOT passed as
      # environment variables — use the docker-compose.s3.yml overlay
      # (file-based Docker secret) when enabling S3 upload.
      S3_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_PREFIX: ${S3_BACKUP_PREFIX:-backups}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - backupdata:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  backupdata:
  caddy_data:
  caddy_config:
