# Production hardening overlay for Ara-infra.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes vs. the dev base:
#   - Builds the dedicated `prod` image stage of each service (no Xdebug,
#     --no-dev deps + optimized autoloader for PHP; the admin panel as a
#     static bundle served by Caddy instead of the Vite dev server).
#   - Drops the dev source bind-mounts via the `!override` tag, so containers
#     run the baked image, not host source (requires Docker Compose v2.24+).
#   - Symfony runs in prod mode with debug output off.
#   - The notification service runs in its enforced production profile
#     (RUN_MODE=production requires API_KEY >= 16 chars and non-empty
#     CORS_ORIGINS; both are validated at startup).
#   - Redis persists with AOF; every long-running service gets a restart policy.
#
# REMAINING HARDENING (track separately):
#   - Run the PHP container as a non-root user.
#   - Rotate POSTGRES_PASSWORD off the "symfony" default; give chat its own DB user.
#   - Redis AUTH (requirepass) once every client is wired to send the password.
#   - Monitoring/alerting (Prometheus + Alertmanager) and off-host backups (S3).
#
# Extra .env values this overlay requires (on top of the dev-required secrets):
#   CORS_ORIGINS=https://admin.example.com     # comma-separated allowed origins

services:
  php:
    build:
      target: prod
    environment:
      APP_ENV: "prod"
      APP_DEBUG: "0"
      XDEBUG_MODE: "off"
    # Keep the Caddy state volumes; drop the ./backend source mount.
    volumes: !override
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  scheduler:
    build:
      target: prod
    environment:
      APP_ENV: "prod"
      APP_DEBUG: "0"
      XDEBUG_MODE: "off"
    volumes: !override []
    restart: unless-stopped

  async-worker:
    build:
      target: prod
    environment:
      APP_ENV: "prod"
      APP_DEBUG: "0"
      XDEBUG_MODE: "off"
    volumes: !override []
    restart: unless-stopped

  administration:
    build:
      target: prod
    # The prod image is Caddy serving the built static bundle (+ API/WS proxy);
    # no source mount and no dev server command.
    volumes: !override []
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    # Enable append-only persistence so cache/queue state survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  notification:
    environment:
      # Production profile: enforces X-API-Key on write endpoints and a
      # non-empty CORS allow-list (both validated at startup).
      RUN_MODE: "production"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be set for the prod overlay — comma-separated allowed origins}"
      # Durability + abuse protection for a real deployment.
      QUEUE_ENABLED: "true"
      ACK_ENABLED: "true"
      RATELIMIT_ENABLED: "true"
    restart: unless-stopped

  chat:
    restart: unless-stopped
